<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fera Talk - Chat with Hugging Face AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Fera Talk</h1>
            <p>Chat with Hugging Face AI Models</p>
        </header>
        
        <div class="config-section">
            <div class="input-group">
                <label for="apiKey">Hugging Face API Token:</label>
                <input type="password" id="apiKey" placeholder="Enter your HF API token">
            </div>
            
            <div class="input-group">
                <label for="modelSelect">Model:</label>
                <select id="modelSelect">
                    <option value="meta-llama/Llama-3.2-3B-Instruct">Meta Llama 3.2 3B Instruct</option>
                    <option value="mistralai/Mistral-7B-Instruct-v0.2">Mistral 7B Instruct</option>
                    <option value="microsoft/DialoGPT-medium">Microsoft DialoGPT Medium</option>
                    <option value="google/flan-t5-large">Google Flan-T5 Large</option>
                    <option value="custom">Custom Model</option>
                </select>
            </div>
            
            <div class="input-group" id="customModelGroup" style="display: none;">
                <label for="customModel">Custom Model ID:</label>
                <input type="text" id="customModel" placeholder="e.g., meta-llama/Llama-2-7b-chat-hf">
            </div>
            
            <div class="input-group">
                <label for="workerUrl">Cloudflare Worker URL (optional):</label>
                <input type="text" id="workerUrl" placeholder="https://your-worker.your-subdomain.workers.dev">
                <small>Leave empty to use direct API (may have CORS issues)</small>
            </div>
        </div>
        
        <div class="chat-container">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-container">
                <textarea id="messageInput" placeholder="Type your message here..." rows="3"></textarea>
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
